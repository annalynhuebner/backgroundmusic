<!DOCTYPE html>
<html>
    <head>
         
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
     
        <a-scene> 
             <a-camera position="0 1.6 0">
            <a-cursor color="black"></a-cursor></a-camera>

<a-assets>
    <audio id="bmg" src="background.mp3" preload="auto"></audio>
    <a-entity id="music" sound=src: #bgm loop:true; volume: 0.4;"></a-entity>
    <audio id="click-sfx" src="sound1.mp3" preload="auto"></audio>
</a-assets>
            
        <a-box
            position="0 1 -5"
            depth="2"
            height="2"
            width="2"
            color="red"
             sound="src: #soundEffect1; on: click; volume: 1;"
           >
        </a-box>
        </a-scene>
        <script>
      document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      const music = document.querySelector('#music');

      const startMusic = () => {
      music.components.sound.playSound();
    };

    // Fires once on the first user interaction
    scene.addEventListener('mousemove', startMusic, { once: true });
    window.addEventListener('touchstart', startMusic, { once: true });
  });
</script>

    </body>
</html>
